# KVM Service Configuration Example
# This file shows how to configure the KVM service for VM management

kvm:
  # Enable or disable the KVM service
  enabled: true

  # Libvirt connection URI
  # Options: "qemu:///system", "qemu:///session", "qemu+tcp://host/system"
  libvirt_uri: "qemu:///system"

  # Storage configuration
  storage_path: "/var/lib/subnet-node/kvm/storage"
  template_path: "/var/lib/subnet-node/kvm/templates"
  storage_pool: "default"

  # Resource limits
  max_vms: 10
  reserved_cpu: 0.2 # Reserve 20% of CPU for host system
  reserved_memory: 0.2 # Reserve 20% of memory for host system

  # Default resources for new VMs (if not specified in request)
  default_resources:
    cpu: 1 # Number of CPU cores
    memory: 1024 # Memory in MB
    disk: 10 # Disk size in GB

  # Default network configuration
  default_network: "default"

  # Network configurations
  networks:
    default:
      type: "nat"
      bridge_name: "virbr0"
      cidr: "192.168.100.0/24"
      gateway: "192.168.100.1"
      dns:
        - "8.8.8.8"
        - "8.8.4.4"

    bridge:
      type: "bridge"
      bridge_name: "br0"
      cidr: "192.168.1.0/24"
      gateway: "192.168.1.1"

    isolated:
      type: "isolated"
      bridge_name: "virbr1"
      cidr: "10.0.0.0/24"

# Example VM template configuration (metadata)
vm_templates:
  ubuntu-20.04:
    name: "Ubuntu 20.04 LTS"
    os: "Ubuntu"
    version: "20.04"
    architecture: "x86_64"
    format: "qcow2"
    file: "ubuntu-20.04.qcow2"
    description: "Ubuntu 20.04 LTS Server with cloud-init support"
    default_user: "ubuntu"
    cloud_init_support: true

  centos-8:
    name: "CentOS 8"
    os: "CentOS"
    version: "8"
    architecture: "x86_64"
    format: "qcow2"
    file: "centos-8.qcow2"
    description: "CentOS 8 Server"
    default_user: "centos"
    cloud_init_support: true

  debian-11:
    name: "Debian 11"
    os: "Debian"
    version: "11"
    architecture: "x86_64"
    format: "qcow2"
    file: "debian-11.qcow2"
    description: "Debian 11 (Bullseye) Server"
    default_user: "debian"
    cloud_init_support: true

# Logging configuration for KVM service
logging:
  kvm:
    level: "info"
    format: "json"

# Security settings
security:
  # VM isolation settings
  enable_apparmor: true
  enable_selinux: false

  # Resource limits per VM
  max_cpu_per_vm: 8
  max_memory_per_vm: "8GB"
  max_disk_per_vm: "100GB"

  # Network security
  enable_firewall: true
  default_firewall_rules:
    - "allow ssh"
    - "allow icmp"

# Monitoring and maintenance
monitoring:
  # Health check interval
  health_check_interval: "30s"

  # Resource monitoring
  collect_vm_stats: true
  stats_interval: "60s"

  # Cleanup settings
  cleanup_orphaned_disks: true
  cleanup_interval: "24h"

  # Backup settings
  enable_vm_backup: false
  backup_schedule: "0 2 * * *" # Daily at 2 AM
  backup_retention: "7d"

# Integration settings
integration:
  # P2P network integration
  enable_p2p_networking: true

  # Container integration
  enable_container_networking: false

  # VPN integration
  enable_vpn_routing: true
