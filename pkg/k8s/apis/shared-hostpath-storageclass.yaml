apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: shared-hostpath
  labels:
    subnet.node: "true"
    app.kubernetes.io/name: "shared-hostpath"
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-minio-storage
  labels:
    subnet.node: "true"
    app.kubernetes.io/name: "shared-minio-storage"
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: shared-hostpath
  hostPath:
    path: /tmp/shared-minio-storage
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-minio-storage-2
  labels:
    subnet.node: "true"
    app.kubernetes.io/name: "shared-minio-storage-2"
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: shared-hostpath
  hostPath:
    path: /tmp/shared-minio-storage
    type: DirectoryOrCreate
