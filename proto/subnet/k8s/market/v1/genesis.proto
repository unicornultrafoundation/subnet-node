syntax = "proto3";
package subnet.k8s.market.v1;

import "gogoproto/gogo.proto";
import "market/v1/order.proto";
import "market/v1/lease.proto";
import "market/v1/bid.proto";
import "market/v1/params.proto";

option go_package = "github.com/unicornultrafoundation/subnet-node/proto/subnet/k8s/market/v1";

// GenesisState defines the basic genesis state used by market module
message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag)  = "params",
    (gogoproto.moretags) = 'yaml:"params"'
  ];
  repeated Order orders = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag)  = "orders",
    (gogoproto.moretags) = 'yaml:"orders"'
  ];
  repeated Lease leases = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag)  = "leases",
    (gogoproto.moretags) = 'yaml:"leases"'
  ];
  repeated Bid bids = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag)  = "bids",
    (gogoproto.moretags) = 'yaml:"bids"'
  ];
}
