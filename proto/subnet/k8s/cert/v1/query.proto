syntax = "proto3";
package subnet.k8s.cert.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "utils/query/pagination.proto";
import "cert/v1/cert.proto";

option go_package = "github.com/unicornultrafoundation/subnet-node/proto/subnet/k8s/cert/v1";

// Query defines the gRPC querier service
service Query {
  // Certificates queries certificates
  rpc Certificates(QueryCertificatesRequest) returns (QueryCertificatesResponse) {
    option (google.api.http).get = "/subnet/k8s/cert/v1/certificates/list";
  }
}

// CertificateResponse contains a single X509 certificate and its serial number
message CertificateResponse {
  Certificate certificate = 1 [
    (gogoproto.nullable)  = false,
    (gogoproto.jsontag)   = "certificate",
    (gogoproto.moretags)  = "yaml:\"certificate\""
  ];

  string serial = 2 [
    (gogoproto.jsontag)  = "serial",
    (gogoproto.moretags) = "yaml:\"serial\""
  ];
}

// QueryDeploymentsRequest is request type for the Query/Deployments RPC method
message QueryCertificatesRequest {
  CertificateFilter filter = 1 [
    (gogoproto.nullable) = false
  ];

  subnet.k8s.utils.query.PageRequest pagination = 2;
}

// QueryCertificatesResponse is response type for the Query/Certificates RPC method
message QueryCertificatesResponse {
  repeated CertificateResponse certificates = 1 [
    (gogoproto.nullable)     = false,
    (gogoproto.castrepeated) = "CertificatesResponse"
  ];

  subnet.k8s.utils.query.PageResponse pagination = 2;
}
