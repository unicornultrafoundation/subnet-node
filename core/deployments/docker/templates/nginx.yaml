version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: "{{.TenantID}}_nginx"
    restart: unless-stopped
    ports:
      - "{{.Port}}"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./logs:/var/log/nginx
    environment:
      - NGINX_HOST={{.Domain}}
      - NGINX_PORT=80
    labels:
      tenant.id: "{{.TenantID}}"
      app: nginx
      version: "{{.Version}}"
    networks:
      - tenant_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tenant_network:
    driver: bridge
    labels:
      tenant.id: "{{.TenantID}}" 