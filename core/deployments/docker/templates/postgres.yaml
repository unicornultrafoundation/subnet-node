version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: "{{.TenantID}}_postgres"
    restart: unless-stopped
    ports:
      - "{{.Port}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB={{.Database}}
      - POSTGRES_USER={{.Username}}
      - POSTGRES_PASSWORD={{.Password}}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    labels:
      tenant.id: "{{.TenantID}}"
      app: postgres
      version: "{{.Version}}"
    networks:
      - tenant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{.Username}} -d {{.Database}}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: {{.MemoryLimit}}
          cpus: '{{.CPULimit}}'
        reservations:
          memory: {{.MemoryReservation}}
          cpus: '{{.CPUReservation}}'

volumes:
  postgres_data:
    driver: local
    labels:
      tenant.id: "{{.TenantID}}"

networks:
  tenant_network:
    driver: bridge
    labels:
      tenant.id: "{{.TenantID}}" 