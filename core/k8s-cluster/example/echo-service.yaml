version: "2.0"
services:
  echo:
    image: hashicorp/http-echo
    command: ["/http-echo"]
    args: ["-listen", ":5678", "-text", "Hello from http-echo!"]
    expose:
      - port: 5678
        as: 80
        proto: TCP
        to:
          - global: true
    resources:
      cpu:
        units:
          value: 1
          unit: m
      memory:
        size:
          value: 256
          unit: Mi
      storage:
        size:
          value: 512
          unit: Mi
    count: 1
    params:
      health:
        http:
          path: /
          port: 5678
          interval: "30s"
          timeout: "5s"
          retries: 3

profiles:
  compute:
    default:
      resources:
        cpu:
          request: 1
          limit: 2
        memory:
          request: 128
          limit: 256
        storage:
          - size: 512
  placement:
    default:
      attributes:
        region: us-west
      pricing:
        cpu:
          denom: uakt
          amount: 1000
        memory:
          denom: uakt
          amount: 500
        storage:
          denom: uakt
          amount: 200

deployment:
  default:
    profile: default
    count: 1

endpoints:
  echo:
    kind: web
