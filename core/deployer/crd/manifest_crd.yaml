apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: manifests.provider.local
spec:
  group: provider.local
  names:
    kind: Manifest
    listKind: ManifestList
    plural: manifests
    singular: manifest
    shortNames:
      - mani
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      image:
                        type: string
                      ports:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            port:
                              type: integer
                            protocol:
                              type: string
                      resources:
                        type: object
                        properties:
                          cpu:
                            type: object
                            properties:
                              units:
                                type: string
                          memory:
                            type: object
                            properties:
                              size:
                                type: string
                          storage:
                            type: object
                            properties:
                              size:
                                type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp 