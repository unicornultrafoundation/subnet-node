services:
  web:
    image: nginx:latest
    command: ["nginx", "-g", "daemon off;"]
    args: ["--config", "/etc/nginx/nginx.conf"]
    env:
      - NGINX_PORT=80
      - NGINX_HOST=0.0.0.0
    volumes:
      - name: config
        mount: /etc/nginx
        read_only: false
      - name: logs
        mount: /var/log/nginx
        read_only: false
    resources:
      cpu:
        units: 0.5
        model: "Intel Xeon"
        arch: "x86_64"
        clock: "2.4GHz"
        cache: 8Mi
      memory:
        size: 512Mi
        type: "DDR4"
        speed: 3200
      gpu:
        units: 0
        attributes:
          vendor:
            nvidia: []
    expose:
      - port: 80
        as: 80
        proto: tcp
        to:
          - service: api
            global: true
            ip: 10.0.0.1
            http_options:
              max_body_size: 1048576
              read_timeout: 30
              send_timeout: 30
              next_tries: 3
              next_timeout: 10
              next_cases: ["error", "timeout"]
        accept:
          items: ["10.0.0.0/8", "192.168.0.0/16"]
        http_options:
          max_body_size: 524288
          read_timeout: 60
          send_timeout: 60
          next_tries: 2
          next_timeout: 5
          next_cases: ["error"]
    count: 2
    credentials:
      host: registry.example.com
      username: user
      password: pass

  api:
    image: node:16-alpine
    command: ["node", "app.js"]
    env:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - name: app-data
        mount: /app/data
        read_only: false
    resources:
      cpu:
        units: 1.0
        model: "Intel Xeon"
        arch: "x86_64"
        clock: "2.4GHz"
        cache: 16Mi
      memory:
        size: 1Gi
        type: "DDR4"
        speed: 3200
      gpu:
        units: 0
        attributes:
          vendor:
            nvidia: []
    expose:
      - port: 3000
        as: 3000
        proto: tcp
    count: 3

  database:
    image: postgres:13
    command: ["postgres", "-c", "max_connections=100"]
    env:
      - POSTGRES_DB=mydb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - name: postgres-data
        mount: /var/lib/postgresql/data
        read_only: false
    resources:
      cpu:
        units: 2.0
        model: "Intel Xeon"
        arch: "x86_64"
        clock: "2.4GHz"
        cache: 32Mi
      memory:
        size: 4Gi
        type: "DDR4"
        speed: 3200
      gpu:
        units: 0
        attributes:
          vendor:
            nvidia: []
    expose:
      - port: 5432
        as: 5432
        proto: tcp
    count: 1

  gpu-service:
    image: nvidia/cuda:11.8-base-ubuntu20.04
    command: ["python", "train.py"]
    env:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - name: model-data
        mount: /workspace/models
        read_only: false
    resources:
      cpu:
        units: 4.0
        model: "Intel Xeon"
        arch: "x86_64"
        clock: "3.0GHz"
        cache: 64Mi
      memory:
        size: 16Gi
        type: "DDR4"
        speed: 3600
      gpu:
        units: 1
        attributes:
          vendor:
            nvidia:
              - model: "RTX 4090"
                ram: 24Gi
                interface: "PCIe 4.0"
    expose:
      - port: 8080
        as: 8080
        proto: tcp
    count: 1

volumes:
  config:
    size: 100Mi
    persistent: false
    storage_class: ""
  logs:
    size: 1Gi
    persistent: false
    storage_class: ""
  app-data:
    size: 10Gi
    persistent: true
    storage_class: ssd
  postgres-data:
    size: 50Gi
    persistent: true
    storage_class: ssd
  model-data:
    size: 100Gi
    persistent: true
    storage_class: nvme