services:
  web:
    image: nginx:latest
    command: ["nginx", "-g", "daemon off;"]
    args: ["--config", "/etc/nginx/nginx.conf"]
    env:
      - NGINX_PORT=80
      - NGINX_HOST=0.0.0.0
    volumes:
      - name: config
        mount_path: /etc/nginx
        size: 1Gi
        persistent: true
        storage_class: fast-ssd
      - name: logs
        mount_path: /var/log/nginx
        size: 100Mi
        persistent: false
    resources:
      cpu: 0.5
      memory: 512Mi
      gpu: 0
    expose:
      - port: 80
        as: 80
        proto: tcp
        to:
          - service: api
            global: true
            ip: 10.0.0.1
            http_options:
              max_body_size: 1048576
              read_timeout: 30
              send_timeout: 30
              next_tries: 3
              next_timeout: 10
              next_cases: ["error", "timeout"]
        accept: ["10.0.0.0/8", "192.168.0.0/16"]
        http_options:
          max_body_size: 524288
          read_timeout: 60
          send_timeout: 60
          next_tries: 2
          next_timeout: 5
          next_cases: ["error"]
    count: 2
    credentials:
      host: registry.example.com
      username: user
      password: pass

  api:
    image: node:16-alpine
    command: ["node", "app.js"]
    env:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - name: app-data
        mount_path: /app/data
        size: 10Gi
        persistent: true
    resources:
      cpu: 1.0
      memory: 1Gi
      gpu: 0
    expose:
      - port: 3000
        as: 3000
        proto: tcp
    count: 3
    ingress:
      - host: api.example.com
        port: 443

  database:
    image: postgres:13
    command: ["postgres", "-c", "max_connections=100"]
    env:
      - POSTGRES_DB=mydb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - name: postgres-data
        mount_path: /var/lib/postgresql/data
        size: 50Gi
        persistent: true
        storage_class: ssd
    resources:
      cpu: 2.0
      memory: 4Gi
      gpu: 0
    expose:
      - port: 5432
        as: 5432
        proto: tcp
    count: 1 